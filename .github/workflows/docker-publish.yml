name: Build and Push Docker Image

run-name: "[${{ github.ref_name }}] ${{ github.event.head_commit.message }}"

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Short SHA
        id: sha
        run: echo "short=$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Sanitize branch name
        id: branch
        run: echo "name=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      # main: bump the real version from conventional commits (feat -> minor, fix -> patch) and push the tag
      - name: Bump version
        if: github.ref == 'refs/heads/main'
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      # non-main: compute the same next version from conventional commits, but don't create/push a tag
      - name: Preview next version
        if: github.ref != 'refs/heads/main'
        id: tag_version_dry
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          dry_run: true
          release_branches: '.*'

      - name: Determine image tags
        id: image_tags
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tags=${REGISTRY}/${IMAGE_NAME}:${{ steps.tag_version.outputs.new_tag }},${REGISTRY}/${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${REGISTRY}/${IMAGE_NAME}:${{ steps.tag_version_dry.outputs.new_tag }}-${{ steps.branch.outputs.name }}-${{ steps.sha.outputs.short }}" >> "$GITHUB_OUTPUT"
          fi
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image_tags.outputs.tags }}
